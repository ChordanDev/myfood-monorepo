name: Scraper

# The Go price scraper in `apps/scraper` (issue #410). It lives in its own
# workflow, not in `ci.yml`, so a scraper change never starts the API and
# mobile jobs, and a change to this file never starts them either (`ci.yml`
# is in both of their path filters). The `paths` filters below are the whole
# trigger: a run that touches nothing under `apps/scraper/` and not this file
# does not start this workflow at all.
#
# Draft pull requests are skipped until they are marked ready for review.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'apps/scraper/**'
      - '.github/workflows/scraper.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/scraper/**'
      - '.github/workflows/scraper.yml'
  workflow_dispatch:

# Same rule as `ci.yml`: a newer run cancels an older one on the same ref,
# except on `main`, where every run gets its own group.
concurrency:
  group: scraper-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  scraper:
    name: Scraper (Go)
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/scraper

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The Go version comes from `go.mod`, so an upstream bump pulled in with
      # `git subtree pull` needs no edit here.
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/scraper/go.mod
          cache-dependency-path: apps/scraper/go.sum

      - name: Build
        run: go build ./...

      # The tests need neither Redis nor the stores: HTTP tests run against
      # `httptest` servers, and no test opens the Redis cache.
      - name: Test
        run: go test ./...
