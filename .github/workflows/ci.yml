name: CI

on:
  pull_request:
  push:
    branches:
      - Develop

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The contract test in `src/services/__tests__/authErrorCodeContract.test.ts`
      # resolves the back source from a sibling of the front checkout. In CI
      # the developer's local `my_food_back` directory is not present, so we
      # clone the back to `../progra-3-back` to satisfy the resolver. Local
      # devs do not need this — the resolver still finds `my_food_back`.
      - name: Checkout backend (sibling)
        uses: actions/checkout@v4
        with:
          repository: ChordanDev/progra-3-back
          path: ../progra-3-back
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test --if-present

      - name: Run lint
        run: npm run lint --if-present

      - name: Run typecheck
        run: |
          if npm run | grep -qE '^[[:space:]]+typecheck'; then
            npm run typecheck
          else
            echo "No 'typecheck' script defined, falling back to 'npx tsc --noEmit'"
            npx tsc --noEmit
          fi
