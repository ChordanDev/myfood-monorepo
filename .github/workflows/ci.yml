name: CI

on:
  pull_request:
  push:
    branches:
      - Develop

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test --if-present

      - name: Run lint
        run: npm run lint --if-present

      - name: Run typecheck
        run: |
          if npm run | grep -qE '^[[:space:]]+typecheck'; then
            npm run typecheck
          else
            echo "No 'typecheck' script defined, falling back to 'npx tsc --noEmit'"
            npx tsc --noEmit
          fi
