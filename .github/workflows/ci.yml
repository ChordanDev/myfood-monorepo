name: CI

on:
  pull_request:
  push:
    branches:
      - main
  # Manual run of both app jobs on any ref, regardless of changed paths.
  workflow_dispatch:

# A newer run cancels an older one on the same ref, except on `main`, where
# every run gets its own group. The app jobs are path-filtered, so a cancelled
# `main` run can be the only one that would have checked that app. A shared
# group with `cancel-in-progress: false` is not enough: a queued run still
# replaces any run already pending in its group.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  # Decide which app jobs need to run from the changed paths. Changes under
  # `docs/` (or anything else outside the two apps) trigger neither job.
  changes:
    name: Detect changed paths
    runs-on: [self-hosted, linux]
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      api: ${{ steps.filter.outputs.api }}
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Skipped on a manual run: there is no changed range to filter, and the
      # app jobs run unconditionally then.
      - name: Filter paths
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api:
              - 'apps/api/**'
              # The api channel and controller tests read the committed mobile
              # fixtures (`apps/api/test/support/planner_fixtures.ex`,
              # `apps/api/test/support/mobile_fixtures.ex`). One glob over every
              # `fixtures` directory below `features`, at any depth, so a new
              # pin cannot be left out of this list.
              - 'apps/mobile/src/features/**/fixtures/**'
              - '.github/workflows/ci.yml'
            # `apps/api/lib/**` is here because the mobile contract test
            # (`authErrorCodeContract.test.ts`) scans the api source for the
            # error codes it emits, so an api-only change can break it.
            # `apps/api/config/config.exs` is here because the mobile refresh
            # tests (`authService.test.ts`) read `refresh_retry_window_seconds`
            # from it: the refresh and its retry must fit inside that window.
            mobile:
              - 'apps/mobile/**'
              - 'apps/api/lib/**'
              - 'apps/api/config/config.exs'
              - '.github/workflows/ci.yml'

  api:
    name: API (Elixir)
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.api == 'true'
    runs-on: [self-hosted, linux]
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/api

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: meal_planner_api_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      # `config/test.exs` reads only this optional override; DB user, password
      # and host are fixed to postgres/postgres/localhost there.
      MYFOOD_TEST_DATABASE: meal_planner_api_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Elixir / OTP
        id: beam
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.17.3"
          otp-version: "27.3"

      - name: Cache deps and build
        uses: actions/cache@v4
        with:
          path: |
            apps/api/deps
            apps/api/_build
          key: mix-${{ runner.os }}-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('apps/api/mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Check formatting
        run: mix format --check-formatted

      - name: Credo
        run: mix credo --strict

      # Fails on any finding (`exit: "low"` in `.sobelow-conf`, which also lists
      # the checks ignored for this deployment and why).
      - name: Sobelow
        run: mix sobelow --config

      - name: Cache Dialyzer PLT
        uses: actions/cache@v4
        with:
          path: apps/api/priv/plts
          key: plt-${{ runner.os }}-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('apps/api/mix.lock') }}
          restore-keys: |
            plt-${{ runner.os }}-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-

      # Dialyzer is a blocking gate. It is clean on the OTP pinned above; newer
      # OTP releases report `call_without_opaque` false positives on
      # `Ecto.Multi`, so expect those when bumping the toolchain.
      - name: Dialyzer
        run: mix dialyzer --format github

      - name: Prepare database
        run: |
          mix ecto.create --quiet
          mix ecto.migrate --quiet

      - name: Run tests
        run: mix test

      # The concurrency tests `mix test` skips (issue #38), such as two
      # concurrent Cooking starts sharing one session. The runner creates a
      # fresh database for them and exits non-zero when one fails.
      - name: Run concurrency tests
        run: mix run --no-start test/support/issue38_concurrency_runner.exs

  mobile:
    name: Mobile (Expo)
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.mobile == 'true'
    runs-on: [self-hosted, linux]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Typecheck
        run: npx tsc --noEmit

      # Jest's transform cache normally lives in the runner's temp dir, so
      # every run re-transforms React Native, Expo and the app through Babel.
      # The key covers what changes every transform (dependencies and Babel
      # config); entries for edited source files miss on their own, since Jest
      # keys each one by file content.
      - name: Cache Jest transforms
        uses: actions/cache@v4
        with:
          path: apps/mobile/.jest-cache
          key: jest-${{ runner.os }}-${{ hashFiles('apps/mobile/package-lock.json', 'apps/mobile/babel.config.js') }}
          restore-keys: |
            jest-${{ runner.os }}-

      - name: Test
        run: npx jest --ci --cacheDirectory=.jest-cache
