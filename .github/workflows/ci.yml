name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decide which app jobs need to run from the changed paths. Changes under
  # `docs/` (or anything else outside the two apps) trigger neither job.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      api: ${{ steps.filter.outputs.api }}
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api:
              - 'apps/api/**'
              - '.github/workflows/ci.yml'
            # `apps/api/lib/**` is here because the mobile contract test
            # (`authErrorCodeContract.test.ts`) scans the api source for the
            # error codes it emits, so an api-only change can break it.
            mobile:
              - 'apps/mobile/**'
              - 'apps/api/lib/**'
              - '.github/workflows/ci.yml'

  api:
    name: API (Elixir)
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/api

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: meal_planner_api_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      # `config/test.exs` reads only this optional override; DB user, password
      # and host are fixed to postgres/postgres/localhost there.
      MYFOOD_TEST_DATABASE: meal_planner_api_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Elixir / OTP
        id: beam
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.17.3"
          otp-version: "27.3"

      - name: Cache deps and build
        uses: actions/cache@v4
        with:
          path: |
            apps/api/deps
            apps/api/_build
          key: mix-${{ runner.os }}-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('apps/api/mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Check formatting
        run: mix format --check-formatted

      # The three static-analysis steps below report without failing the job.
      # Credo still has a backlog, and Dialyzer has only been measured on a
      # newer OTP than the one pinned here, so they stay informational until
      # a clean run on this toolchain is confirmed.
      - name: Credo
        continue-on-error: true
        run: mix credo --strict

      - name: Sobelow
        continue-on-error: true
        run: mix sobelow --config

      - name: Cache Dialyzer PLT
        uses: actions/cache@v4
        with:
          path: apps/api/priv/plts
          key: plt-${{ runner.os }}-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('apps/api/mix.lock') }}
          restore-keys: |
            plt-${{ runner.os }}-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-

      - name: Dialyzer
        continue-on-error: true
        run: mix dialyzer --format github

      - name: Prepare database
        run: |
          mix ecto.create --quiet
          mix ecto.migrate --quiet

      - name: Run tests
        run: mix test

  mobile:
    name: Mobile (Expo)
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npx jest --ci
